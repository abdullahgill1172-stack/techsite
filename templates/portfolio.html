{% extends "base.html" %}

{% block title %}
Portfolio
{% endblock %}

{% block content %}

<h1>Our Projects</h1>

<div class="portfolio-grid">

    {% for project in projects %}

    <div class="portfolio-card">

        <img
        src="{{ url_for('static', filename=project.image) }}"
        alt="project image">

        <h2>{{ project.title }}</h2>

        <p>{{ project.description }}</p>

    </div>

    {% endfor %}

</div>

{% endblock %}
