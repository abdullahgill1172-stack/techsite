{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}

<section class="login-section">
    <div class="login-box" data-aos="fade-up">
        <div class="login-logo">
            <span class="logo-bracket">[</span>HECG<span class="logo-accent">.</span><span class="logo-bracket">]</span>
        </div>
        <h2>Admin Login</h2>
        <p>Authorized personnel only.</p>

        <form method="POST" action="{{ url_for('login') }}" class="contact-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-primary btn-full">
                Login <i class="ti ti-login"></i>
            </button>
        </form>

        <a href="{{ url_for('index') }}" class="login-back">
            <i class="ti ti-arrow-left"></i> Back to website
        </a>
    </div>
</section>

{% endblock %}
